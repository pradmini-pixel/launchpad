name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/dayone-morning-ritual-2k0j5j"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: set a repo variable VITE_GROQ_BASE_URL to your Groq proxy
          # (Cloudflare Worker URL + /openai/v1) so the deployed app reaches Groq
          # out of the box. Leave unset to use Claude / Ollama / offline instead.
          VITE_GROQ_BASE_URL: ${{ vars.VITE_GROQ_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
