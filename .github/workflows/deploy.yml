name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/dayone-morning-ritual-2k0j5j"]
  workflow_dispatch:

# Publishing to the gh-pages branch only needs write access to repo contents.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishes ./dist to the gh-pages branch (creates .nojekyll). Pages is
      # served from that branch, which avoids the github-pages environment gate.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
