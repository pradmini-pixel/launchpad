# Netlify deploy config for DayOne.
#
# The /groq proxy recreates the Vite dev proxy in production so the browser
# makes a same-origin request and avoids CORS. Your Groq key travels in the
# Authorization header, which Netlify forwards untouched — nothing is stored
# server-side. Order matters: the /groq rule must come before the SPA fallback.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/groq/*"
  to = "https://api.groq.com/:splat"
  status = 200
  force = true

# Single-page app fallback: every other path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
